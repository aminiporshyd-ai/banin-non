<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بنين حبيبتي ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bubbles">

        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>

    </div>


    <main class="page">

        <!-- صفحه رمز -->

        <section class="password-box" id="passwordBox">

            <h1>بنين حبيبتي</h1>

            <p>
                سویت شیی اتمنه یعجبچ ❤️
            </p>

            <p>
                أدخلي الرمز لفتح هديّتكِ
            </p>

            <input
                type="password"
                id="passwordInput"
                placeholder="أدخلي الرمز"
                inputmode="numeric"
                autocomplete="off"
            >

            <button id="enterButton">
                افتحي هديّتكِ 🎁
            </button>

            <p id="errorMessage"></p>

        </section>


        <!-- صفحه هدیه -->

        <section class="gift-box" id="giftBox">

            <div class="gift-content">

                <div class="heart">
                    ♥️
                </div>

                <h2>
                    بنين حبيبتي
                </h2>

                <p>
                    های الهدیهههه❤️
                </p>

                <p>
                    اتمنه هل هدیه یجیب الابتسامه فی شفایفچ...
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
